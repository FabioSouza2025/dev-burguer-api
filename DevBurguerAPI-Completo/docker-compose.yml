services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devburger-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      PG_DIALECT: postgres
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USERNAME: ${PG_USERNAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-devburger}
      MONGO_URI: mongodb://mongo:27017/${MONGO_DATABASE:-devburger}
      JWT_SECRET: ${JWT_SECRET:-devburger-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-5d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npm run migrate && npm run seed && npm run start"

  postgres:
    image: postgres:15-alpine
    container_name: devburger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-devburger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:6.0
    container_name: devburger-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  mongodata:
